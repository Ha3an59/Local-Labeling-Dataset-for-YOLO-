<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local YOLO Labeler</title><link rel="stylesheet" href="/static/css/app.css"></head><body><div class="app"><aside><h2>YOLO Labeler</h2><button onclick="newProject()">＋ پروژه جدید</button><div id="projects"></div></aside><main><header><div><h1 id="title">پروژه‌ای انتخاب نشده</h1><small id="stats"></small></div><div class="actions"><label class="btn">＋ افزودن تصویر/ویدئو<input id="files" type="file" multiple accept="image/*,video/*" hidden></label><button onclick="openFrameTool()">🎞 استخراج فریم از ویدئو</button><label class="btn">📦 Import YOLO<input id="importZip" type="file" accept=".zip" hidden></label><button onclick="deleteProject()">🗑 حذف پروژه</button><select id="exportFormat"><option value="yolo_box">YOLO Detection (Box)</option><option value="yolo_seg">YOLO Segmentation (Polygon)</option></select><button onclick="exportData()">⬇ خروجی YOLO</button></div></header><section class="toolbar"><div><b>کلاس‌ها</b><div id="classes" class="classes"></div></div><button onclick="addClass()">＋ کلاس</button><div class="modeBtns"><button id="boxMode" class="active" onclick="setMode('box')">▣ Bounding Box</button><button id="segMode" onclick="setMode('seg')">◈ Segmentation</button><button onclick="deleteSelected()">🗑 حذف انتخاب</button></div><span id="modeHint" class="hint">کشیدن = Box | کلیک روی Box = انتخاب | دستگیره‌ها = تغییر اندازه | داخل Box = جابه‌جایی</span></section><section class="workspace"><div class="items" id="items"></div><div class="canvasWrap"><div id="empty">یک تصویر انتخاب کنید</div><canvas id="canvas"></canvas><video id="video" controls hidden></video></div></section></main></div>
<div id="frameModal" class="modal" hidden><div class="modalBox"><h3>استخراج فریم از ویدئو</h3><label>ویدئو<select id="frameVideo"></select></label><div id="videoInfo" class="info"></div><label>حالت<select id="frameMode" onchange="toggleFrameRange()"><option value="all">همه فریم‌ها</option><option value="range">بازه مشخص</option></select></label><div id="rangeFields" class="rangeFields" hidden><label>از فریم <input id="frameStart" type="number" min="0" value="0"></label><label>تا فریم <input id="frameEnd" type="number" min="0" value="0"></label><label>هر چند فریم یک‌بار <input id="frameStep" type="number" min="1" value="1"></label></div><div class="modalActions"><button onclick="closeFrameTool()">لغو</button><button onclick="extractFrames()">استخراج</button></div></div></div>
<script src="/static/js/app.js"></script></body></html>
